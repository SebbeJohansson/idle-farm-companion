# Local AI services for idle-game's digger (see idle-game's digger-plan.md).
#
#   docker compose up -d --wait     # start, and wait until healthy
#   docker compose logs -f laya     # watch it
#   docker compose down             # stop (downloaded weights are kept)
#
# Laya judges generated content (it decides, it doesn't write); `art` draws
# sprites for it. Ollama, which writes the text, runs natively on the
# Windows host instead of in here — see README.md.

services:
  laya:
    # Built straight from Laya's repository at a pinned release, so this repo
    # carries no copy of their code. Bump the tag deliberately.
    build:
      context: https://github.com/NandhaKishorM/laya.git#${LAYA_VERSION:-v0.3.22}
      args:
        TORCH_INDEX: cpu
    image: idle-game-companion/laya:${LAYA_VERSION:-v0.3.22}
    command: ["laya-serve"]
    ports:
      # Loopback only: the API has no authentication unless LAYA_API_KEY is
      # set. The game's dev server and scripts run in WSL and reach it here.
      - "127.0.0.1:${LAYA_PORT:-8000}:${LAYA_PORT:-8000}"
    environment:
      LAYA_HOST: 0.0.0.0
      LAYA_PORT: ${LAYA_PORT:-8000}
      # CPU on purpose: Laya is small and fast enough there, and the GPU stays
      # free for the LLM (and later image generation).
      LAYA_DEVICE: cpu
      # Biome text is English; skipping the multilingual and typed-decisions
      # checkpoints saves most of the memory and download.
      LAYA_MODELS: english
      LAYA_PRELOAD: 1
      LAYA_THREADS: ${LAYA_THREADS:-4}
      OMP_NUM_THREADS: ${LAYA_THREADS:-4}
      LAYA_API_KEY: ${LAYA_API_KEY:-}
      LAYA_LOG_LEVEL: ${LAYA_LOG_LEVEL:-info}
    volumes:
      - laya-models:/home/laya/.cache/huggingface
    init: true
    # Comes back after a crash, a reboot, or Docker restarting — the "always
    # up" part. `docker compose down` or `stop` is what turns it off.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['LAYA_PORT'] + '/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      # The first start downloads the checkpoint before it answers.
      start_period: 10m
      start_interval: 2s

  # Fetches the image model into its volume on first start; later starts
  # find it there and exit at once.
  art-models:
    image: curlimages/curl:8.11.1
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        if [ -s "/models/$$ART_MODEL_FILE" ]; then echo "model present: $$ART_MODEL_FILE"; exit 0; fi
        echo "downloading $$ART_MODEL_URL"
        curl -fL --retry 3 -o "/models/$$ART_MODEL_FILE.part" "$$ART_MODEL_URL"
        mv "/models/$$ART_MODEL_FILE.part" "/models/$$ART_MODEL_FILE"
    environment:
      ART_MODEL_URL: ${ART_MODEL_URL:-https://huggingface.co/PublicPrompts/All-In-One-Pixel-Model/resolve/main/Public-Prompts-Pixel-Model.ckpt}
      ART_MODEL_FILE: ${ART_MODEL_FILE:-Public-Prompts-Pixel-Model.ckpt}
    volumes:
      - art-models:/models

  # stable-diffusion.cpp's server on the GPU. Not ComfyUI: current PyTorch
  # builds dropped Pascal GPUs (GTX 10-series), and this is built on ggml
  # like Ollama, which runs on them fine. Speaks the Automatic1111 API at
  # /sdapi/v1/txt2img.
  art:
    # Upstream only publishes `master-*` tags, so the digest is the pin.
    # Swap `-cuda` for `-vulkan` if CUDA doesn't work on a GPU.
    image: ghcr.io/leejet/stable-diffusion.cpp:master-cuda@sha256:bc12de387c5def38f4bb826912d8c8a1d3d7c7c2cb2ccbe2423280aa50a0a636
    entrypoint: ["/sd-server"]
    command: ["-m", "/models/${ART_MODEL_FILE:-Public-Prompts-Pixel-Model.ckpt}", "-l", "0.0.0.0", "--listen-port", "7860"]
    ports:
      - "127.0.0.1:${ART_PORT:-7860}:7860"
    volumes:
      - art-models:/models
    depends_on:
      art-models:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    init: true
    restart: unless-stopped

volumes:
  laya-models:
  art-models:
